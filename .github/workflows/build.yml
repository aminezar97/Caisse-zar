name: Zarouali Caisse - Web APK AAB Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zarouali-build-${{ github.ref }}
  cancel-in-progress: true


# ==================================================
# WEB / GITHUB PAGES
# ==================================================

jobs:

  web:
    name: Web + GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website
        run: |
          test -f www/index.html
          test -f www/manifest.webmanifest
          test -f www/sw.js
          test -f www/html5-qrcode.min.js
          echo "Website OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ==================================================
  # ANDROID
  # ==================================================

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build installable Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare Android artifacts
        run: |
          mkdir -p release/android

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/android/Zarouali-Caisse.apk

          cp android/app/build/outputs/apk/release/app-release.apk \
             release/android/Zarouali-Caisse-release-unsigned.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
             release/android/Zarouali-Caisse.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-Caisse-Android
          path: release/android
          retention-days: 30


  # ==================================================
  # WINDOWS
  # ==================================================

  windows:
    name: Windows Setup EXE
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npx electron-builder --win nsis portable --publish never

      - name: List generated files
        shell: bash
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-Caisse-Windows
          path: dist/*
          retention-days: 30
