name: Zarouali Caisse - Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  inspect:
    name: Check Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check www
        run: |
          echo "Checking www..."
          test -f www/index.html
          echo "✅ www/index.html found"

      - name: Show project
        run: |
          echo "Project structure:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            | sort | head -200


  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: inspect

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Detect project
        run: |
          echo "Checking project..."

          if [ -f package.json ]; then
            echo "PACKAGE_JSON=true" >> $GITHUB_ENV
          else
            echo "PACKAGE_JSON=false" >> $GITHUB_ENV
          fi

          if [ -f capacitor.config.ts ] || \
             [ -f capacitor.config.js ] || \
             [ -f capacitor.config.json ]; then
            echo "CAPACITOR_CONFIG=true" >> $GITHUB_ENV
          else
            echo "CAPACITOR_CONFIG=false" >> $GITHUB_ENV
          fi

          if [ -d android ]; then
            echo "ANDROID_EXISTING=true" >> $GITHUB_ENV
          else
            echo "ANDROID_EXISTING=false" >> $GITHUB_ENV
          fi

      - name: Create package.json if missing
        if: env.PACKAGE_JSON == 'false'
        run: |
          npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config if missing
        if: env.CAPACITOR_CONFIG == 'false'
        run: |
          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.zarouali.caisse",
            "appName": "Zarouali Caisse",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          CONFIG

      - name: Create Android project if missing
        if: env.ANDROID_EXISTING == 'false'
        run: |
          npx cap add android

      - name: Sync Web to Android
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Android files
        run: |
          mkdir -p release/android

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/android/Zarouali-Caisse-debug.apk

          cp android/app/build/outputs/apk/release/app-release.apk \
             release/android/Zarouali-Caisse-release.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
             release/android/Zarouali-Caisse.aab

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-Caisse-Android
          path: release/android
          retention-days: 30


  web:
    name: Web/PWA
    runs-on: ubuntu-latest
    needs: inspect

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare website
        run: |
          mkdir -p release/web
          cp -r www/* release/web/

      - name: Add deployment information
        run: |
          echo "Zarouali Caisse Web Build" > release/web/build-info.txt
          echo "Commit: $GITHUB_SHA" >> release/web/build-info.txt
          echo "Built: $(date -u)" >> release/web/build-info.txt

      - name: Upload Website
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-Caisse-Web
          path: release/web
          retention-days: 30
