name: Build Zarouali Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "admin-apk/**"
      - ".github/workflows/admin-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: admin-apk
        run: npm install

      - name: Create Capacitor project
        working-directory: admin-apk
        run: |
          npm install @capacitor/cli@8.5.0 @capacitor/core@8.5.0 @capacitor/android@8.5.0
          npx cap init "Zarouali Admin" "com.zarouali.caisse.admin" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: admin-apk/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-Admin-APK
          path: admin-apk/android/app/build/outputs/apk/debug/app-debug.apk
