name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Web Assets & Generate Icon
      run: |
        npm install
        
        if [ ! -d "www" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Caisse App</title></head><body><h1>Caisse Mobile App</h1></body></html>' > www/index.html
        fi

        rm -rf android
        npx cap add android

        if [ -f "icon.png" ]; then
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android
        fi

        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: caisse-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
