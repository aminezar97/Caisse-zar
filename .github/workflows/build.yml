name: Zarouali Caisse - Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zarouali-caisse-${{ github.ref }}
  cancel-in-progress: true

jobs:

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify web project
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Add camera permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<manifest /a\
            <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: android
