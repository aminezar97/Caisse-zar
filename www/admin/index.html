<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zarouali Caisse — Admin</title>
<style>
body{margin:0;background:#f5f7f2;font-family:Arial,sans-serif;color:#111}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:white;padding:30px;border-radius:20px;width:min(400px,85%);box-shadow:0 10px 40px #0002}
h1{margin-top:0}
input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#5a8f2d;color:white;font-weight:bold;margin-top:10px}
#app{display:none;padding:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:white;padding:20px;border-radius:15px}
.value{font-size:28px;font-weight:bold}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login">
<div class="box">
<h1>ZAROUALI CAISSE</h1>
<p>Administration à distance</p>
<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn">Se connecter</button>
<p id="error"></p>
</div>
</div>

<div id="app">
<h1>ZAROUALI CAISSE — ADMIN</h1>
<p>Dashboard</p>
<div class="cards">
<div class="card">Chiffre d'affaires<div class="value" id="ca">0 MAD</div></div>
<div class="card">Tickets<div class="value" id="tickets">0</div></div>
<div class="card">Produits<div class="value" id="products">0</div></div>
<div class="card">Stock faible<div class="value" id="low">0</div></div>
</div>
</div>

<script>
document.getElementById("loginBtn").onclick=function(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
};
</script>

</body>
</html>
