name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Ensure Web Folder Exists
      run: |
        if [ ! -d "www" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then
          mkdir -p www
          echo '<!DOCTYPE html><html><head><title>App</title></head><body><h1>Caisse App</h1></body></html>' > www/index.html
        fi

    - name: Capacitor Sync
      run: |
        npx --yes @capacitor/cli init "CaisseApp" "com.caisse.app" --web-dir www || true
        npx --yes @capacitor/cli add android || true
        npx --yes @capacitor/cli sync android || true

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: caisse-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
