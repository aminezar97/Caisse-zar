name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Web Assets & Capacitor Clean Build
      run: |
        npm install
        
        # إنشاء المجلد في حال عدم وجوده
        if [ ! -d "www" ] && [ ! -d "dist" ] && [ ! -d "build" ]; then
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Caisse App</title></head><body><h1>Caisse Mobile App</h1></body></html>' > www/index.html
        fi

        # إعادة تهيئة منصة أندرويد بالكامل
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: caisse-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
