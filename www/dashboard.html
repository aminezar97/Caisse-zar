<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarouali POS — Tableau de bord</title>
<style>
    :root {
        --primary: #8BC34A;
        --primary-light: #AED581;
        --primary-dark: #689F38;
        --accent: #f5a623;
        --danger: #e5534b;
        --bg: #0a0a0a;
        --card: #161616;
        --card2: #1e1e1e;
        --border: #2a2a2a;
        --text: #e8e8e8;
        --text-muted: #999;
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        min-height: 100%;
    }
    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: linear-gradient(180deg, #101a08, #0a0a0a);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 {
        font-size: 19px;
        color: var(--primary-light);
        letter-spacing: 0.3px;
    }
    .brand span {
        font-size: 12px;
        color: var(--text-muted);
    }
    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
    }
    .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--danger);
        transition: background 0.3s;
    }
    .dot.live {
        background: var(--primary);
        box-shadow: 0 0 0 0 rgba(139,195,74,0.6);
        animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(139,195,74,0.5); }
        70% { box-shadow: 0 0 0 7px rgba(139,195,74,0); }
        100% { box-shadow: 0 0 0 0 rgba(139,195,74,0); }
    }

    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 24px;
    }
    .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
    }
    .stat .label {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 6px;
    }
    .stat .value {
        font-size: 22px;
        font-weight: 700;
        color: var(--primary-light);
    }
    .stat.warn .value { color: var(--accent); }
    .stat.warn.active { border-color: var(--accent); }

    nav.tabs {
        display: flex;
        gap: 6px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
        overflow-x: auto;
    }
    nav.tabs button {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 14px;
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
    }
    nav.tabs button.active {
        color: var(--primary-light);
        border-bottom-color: var(--primary);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .search {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        margin-bottom: 12px;
    }
    .search:focus { outline: none; border-color: var(--primary); }

    .table-wrap {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
        text-align: left;
        padding: 10px 12px;
        white-space: nowrap;
        border-bottom: 1px solid var(--border);
    }
    th {
        color: var(--text-muted);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        background: var(--card2);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(139,195,74,0.05); }
    .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
    }
    .pill.low { background: rgba(229,83,75,0.15); color: #ff8a80; }
    .pill.ok { background: rgba(139,195,74,0.15); color: var(--primary-light); }
    .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
    }
    .muted { color: var(--text-muted); }
</style>
</head>
<body>

<header>
    <div class="brand">
        <h1>Zarouali POS</h1>
        <span>Tableau de bord — lecture seule</span>
    </div>
    <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connexion...</span>
    </div>
</header>

<main>
    <div class="stats" id="stats"></div>

    <nav class="tabs">
        <button data-panel="apercu" class="active">Aperçu</button>
        <button data-panel="produits">Produits</button>
        <button data-panel="ventes">Ventes</button>
        <button data-panel="clients">Clients</button>
    </nav>

    <div class="panel active" id="apercu">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Dernières ventes</th><th>Client</th><th>Paiement</th><th>Total</th></tr></thead>
                <tbody id="apercuBody"><tr><td colspan="4" class="empty">Chargement...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel" id="produits">
        <input class="search" id="produitsSearch" placeholder="Rechercher un produit...">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th></tr></thead>
                <tbody id="produitsBody"><tr><td colspan="5" class="empty">Chargement...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel" id="ventes">
        <input class="search" id="ventesSearch" placeholder="Rechercher une vente (id, client)...">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Ticket</th><th>Date</th><th>Client</th><th>Paiement</th><th>Total</th></tr></thead>
                <tbody id="ventesBody"><tr><td colspan="5" class="empty">Chargement...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel" id="clients">
        <input class="search" id="clientsSearch" placeholder="Rechercher un client...">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Client</th><th>Téléphone</th><th>Dette</th><th>Total achats</th></tr></thead>
                <tbody id="clientsBody"><tr><td colspan="4" class="empty">Chargement...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
        getFirestore, doc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import {
        getAuth, signInAnonymously, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB9juWEafOYe0uKeh_rhSBzCy6OMfyVAhM",
        authDomain: "zarouali-caisse.firebaseapp.com",
        projectId: "zarouali-caisse",
        storageBucket: "zarouali-caisse.firebasestorage.app",
        messagingSenderId: "460165316759",
        appId: "1:460165316759:web:5b8e8eab8c1fdaa70669d2",
        measurementId: "G-6JDNJTKEXJ"
    };

    const app = initializeApp(firebaseConfig);
    const dbRef = getFirestore(app);
    const auth = getAuth(app);
    const mainDoc = doc(dbRef, "caisse", "main");

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    let currentData = { products: [], clients: [], sales: [], cashiers: [] };

    function money(v) {
        return Number(v || 0).toFixed(2) + " DH";
    }

    function escapeHTML(v) {
        return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function localDateISO() {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }

    function renderStats() {
        const today = localDateISO();
        const sales = currentData.sales || [];
        const todaySales = sales.filter(s => (s.date || "").startsWith(today));
        const todayTotal = todaySales.reduce((sum, s) => sum + Number(s.total || 0), 0);
        const products = currentData.products || [];
        const lowStock = products.filter(p => Number(p.stock) <= Number(p.minStock ?? 5));
        const clients = currentData.clients || [];

        const stats = [
            { label: "Ventes aujourd'hui", value: todaySales.length + " (" + money(todayTotal) + ")" },
            { label: "Produits", value: products.length },
            { label: "Stock faible", value: lowStock.length, warn: true, active: lowStock.length > 0 },
            { label: "Clients", value: clients.length },
            { label: "Total tickets", value: sales.length }
        ];

        document.getElementById("stats").innerHTML = stats.map(s => `
            <div class="stat ${s.warn ? 'warn' : ''} ${s.active ? 'active' : ''}">
                <div class="label">${escapeHTML(s.label)}</div>
                <div class="value">${escapeHTML(s.value)}</div>
            </div>
        `).join("");
    }

    function clientName(id) {
        const c = (currentData.clients || []).find(c => c.id === id);
        return c ? c.name : "—";
    }

    function renderApercu() {
        const sales = [...(currentData.sales || [])].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 15);
        const body = document.getElementById("apercuBody");
        if (!sales.length) {
            body.innerHTML = `<tr><td colspan="4" class="empty">Aucune vente pour le moment</td></tr>`;
            return;
        }
        body.innerHTML = sales.map(s => `
            <tr>
                <td>${escapeHTML(s.id)}<br><span class="muted">${new Date(s.date).toLocaleString("fr-FR")}</span></td>
                <td>${escapeHTML(clientName(s.clientId))}</td>
                <td>${escapeHTML(s.payment)}</td>
                <td>${money(s.total)}</td>
            </tr>
        `).join("");
    }

    function renderProduits(filter) {
        let products = currentData.products || [];
        if (filter) {
            const f = filter.toLowerCase();
            products = products.filter(p => (p.name || "").toLowerCase().includes(f) || (p.category || "").toLowerCase().includes(f));
        }
        const body = document.getElementById("produitsBody");
        if (!products.length) {
            body.innerHTML = `<tr><td colspan="5" class="empty">Aucun produit</td></tr>`;
            return;
        }
        body.innerHTML = products.map(p => {
            const low = Number(p.stock) <= Number(p.minStock ?? 5);
            return `
            <tr>
                <td>${escapeHTML(p.name)}</td>
                <td class="muted">${escapeHTML(p.category)}</td>
                <td>${money(p.price)}</td>
                <td>${escapeHTML(p.stock)}</td>
                <td><span class="pill ${low ? 'low' : 'ok'}">${low ? 'Faible' : 'OK'}</span></td>
            </tr>`;
        }).join("");
    }

    function renderVentes(filter) {
        let sales = [...(currentData.sales || [])].sort((a,b) => new Date(b.date) - new Date(a.date));
        if (filter) {
            const f = filter.toLowerCase();
            sales = sales.filter(s => (s.id || "").toLowerCase().includes(f) || clientName(s.clientId).toLowerCase().includes(f));
        }
        const body = document.getElementById("ventesBody");
        if (!sales.length) {
            body.innerHTML = `<tr><td colspan="5" class="empty">Aucune vente</td></tr>`;
            return;
        }
        body.innerHTML = sales.map(s => `
            <tr>
                <td>${escapeHTML(s.id)}</td>
                <td class="muted">${new Date(s.date).toLocaleString("fr-FR")}</td>
                <td>${escapeHTML(clientName(s.clientId))}</td>
                <td>${escapeHTML(s.payment)}</td>
                <td>${money(s.total)}</td>
            </tr>
        `).join("");
    }

    function renderClients(filter) {
        let clients = currentData.clients || [];
        if (filter) {
            const f = filter.toLowerCase();
            clients = clients.filter(c => (c.name || "").toLowerCase().includes(f));
        }
        const body = document.getElementById("clientsBody");
        if (!clients.length) {
            body.innerHTML = `<tr><td colspan="4" class="empty">Aucun client</td></tr>`;
            return;
        }
        body.innerHTML = clients.map(c => `
            <tr>
                <td>${escapeHTML(c.name)}</td>
                <td class="muted">${escapeHTML(c.phone || "—")}</td>
                <td>${money(c.debt)}</td>
                <td>${money(c.totalPurchases)}</td>
            </tr>
        `).join("");
    }

    function renderAll() {
        renderStats();
        renderApercu();
        renderProduits(document.getElementById("produitsSearch").value);
        renderVentes(document.getElementById("ventesSearch").value);
        renderClients(document.getElementById("clientsSearch").value);
    }

    // Tabs
    document.querySelectorAll("nav.tabs button").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(btn.dataset.panel).classList.add("active");
        });
    });

    // Search
    document.getElementById("produitsSearch").addEventListener("input", e => renderProduits(e.target.value));
    document.getElementById("ventesSearch").addEventListener("input", e => renderVentes(e.target.value));
    document.getElementById("clientsSearch").addEventListener("input", e => renderClients(e.target.value));

    // Firebase connection
    onAuthStateChanged(auth, function(user) {
        if (!user) return;
        statusText.textContent = "En direct";
        statusDot.classList.add("live");

        onSnapshot(mainDoc, function(snap) {
            if (snap.exists()) {
                currentData = snap.data();
                renderAll();
            }
        }, function(err) {
            statusText.textContent = "Erreur de connexion";
            statusDot.classList.remove("live");
            console.error(err);
        });
    });

    signInAnonymously(auth).catch(function(err) {
        statusText.textContent = "Erreur d'authentification";
        console.error(err);
    });
</script>

</body>
</html>
