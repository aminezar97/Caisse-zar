<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: filesystem:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Souk Caisse</title>
<style>
:root{--ink:#1F2A24;--ink-soft:#5A6B62;--paper:#F1EDE1;--paper-alt:#E7E0CC;--card:#fff;--green:#2F6B4F;--green-dark:#204A37;--green-light:#E3EEE6;--spice:#C77D2E;--spice-light:#F7E7D0;--danger:#B23A3A;--danger-light:#F6E1DF;--border:#DCD3BB;--radius-sm:8px;--radius:14px;--radius-lg:20px;--shadow:0 2px 10px rgba(31,42,36,.08);--shadow-lift:0 10px 30px rgba(31,42,36,.18);--font-display:'Segoe UI',ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;--font-body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-mono:ui-monospace,'SFMono-Regular','Roboto Mono',Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,input,select{font-family:inherit}button{cursor:pointer}h2,h3{font-family:var(--font-display);letter-spacing:-.01em;margin:0}.muted{color:var(--ink-soft);font-size:.88rem}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--green-dark);color:#fff;flex-shrink:0}.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--spice);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}.store-name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar-right{display:flex;align-items:center;gap:8px}.datetime{font-size:.78rem;opacity:.8;white-space:nowrap;display:none}.cashier-select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 10px;font-size:.82rem;max-width:150px}.cashier-select option{color:var(--ink);background:#fff}
.bottomnav{display:flex;flex-shrink:0;background:var(--card);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:6px 2px;color:var(--ink-soft);font-size:.72rem;border-radius:8px}.nav-icon{font-size:1.25rem;line-height:1}.navbtn.active{color:var(--green-dark);font-weight:700}
#views{flex:1;min-height:0;overflow:hidden;position:relative}.view{display:none;height:100%;overflow-y:auto;padding:14px}.view.active{display:block}.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}.view-header h2{font-size:1.25rem}

.barcode-field-row{display:flex;gap:8px}.barcode-field-row input{flex:1}
#qr-reader{border-radius:8px;overflow:hidden;border:1px solid var(--border);min-height:220px;background:#000}#qr-reader video{border-radius:8px}.scanner-error{margin-top:10px;background:var(--danger-light);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:.82rem}

:1px solid var(--border);border-radius:8px;padding:8px;font-size:.8rem;background:var(--card)}.discount-row select{flex:1.3}.discount-row input{flex:1;width:0}.discount-row input:disabled{background:var(--paper)}.cart-totals{padding:10px 16px 4px}.cart-totals .row{display:flex;justify-content:space-between;font-size:.85rem;padding:3px 0;color:var(--ink-soft)}.cart-totals .row.total{font-family:var(--font-mono);font-size:1.35rem;font-weight:800;color:var(--ink);border-top:1px dashed var(--border);margin-top:4px;padding-top:8px}.discount-line span:last-child{color:var(--spice)}
.btn-primary,.btn-secondary,.btn-danger{border:none;border-radius:8px;padding:11px 16px;font-weight:700;font-size:.88rem}.btn-primary{background:var(--green);color:#fff}.btn-primary:disabled{background:var(--border);color:#fff;opacity:.7;cursor:not-allowed}.btn-secondary{background:var(--paper-alt);color:var(--ink)}.btn-danger{background:var(--danger);color:#fff}.btn-large{width:calc(100% - 32px);margin:8px 16px 14px;font-size:1rem;padding:14px}
.products-table{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}.pt-row{display:grid;grid-template-columns:2fr 1.3fr 1fr 1.2fr auto;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:.85rem}.pt-head{background:var(--paper);font-size:.68rem;text-transform:uppercase;color:var(--ink-soft);font-weight:700}.pt-name{font-weight:700;display:flex;align-items:center;gap:8px}.pt-name small{font-weight:400;color:var(--ink-soft);font-family:var(--font-mono);font-size:.68rem}.pt-thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--paper-alt)}.low-text{color:var(--danger);font-weight:700}.pt-actions{display:flex;gap:6px;justify-self:end}.icon-btn{background:var(--paper);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;font-size:.85rem}.icon-btn.danger{color:var(--danger)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}.stat-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}.stat-label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;font-weight:700}.stat-value{font-family:var(--font-mono);font-size:1.4rem;font-weight:800;color:var(--green-dark)}.hist-columns{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}.top-products,.sales-list-wrap{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}.hist-columns h3{font-size:.95rem;margin-bottom:8px}.top-product-row{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.82rem}.tp-rank{font-family:var(--font-mono);font-weight:800;color:var(--spice)}.tp-qty{color:var(--ink-soft);font-size:.75rem}.tp-revenue{font-family:var(--font-mono);font-weight:700}.sale-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border);font-size:.82rem}.sale-row:last-child{border-bottom:none}.sr-num{font-family:var(--font-mono);color:var(--ink-soft)}.sr-total{font-family:var(--font-mono);font-weight:700}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}.settings-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.settings-card h3{margin-bottom:12px;font-size:1rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}.form-grid label.span2{grid-column:1/-1}.form-grid input,.form-grid select{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.88rem;color:var(--ink);background:var(--paper)}.cat-manage-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}.cat-name-input{flex:1;border:1px solid transparent;background:none;padding:6px 4px;font-size:.85rem;border-radius:6px}.add-category-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}.add-category-row input{flex:1;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:9px}.color-swatches{display:flex;gap:5px;align-items:center}.swatch{width:20px;height:20px;border-radius:50%;background:var(--sw);border:2px solid transparent}.swatch.selected{border-color:var(--ink)}.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.file-btn{position:relative;display:inline-flex;align-items:center}.cashier-row{display:flex;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}.cashier-name-input{flex:1;border:1px solid transparent;background:none;padding:7px;border-radius:6px}.cashier-name-input:focus{border-color:var(--border);background:var(--paper)}
.modal-overlay{position:fixed;inset:0;background:rgba(31,42,36,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;animation:fadeIn .15s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal-card{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lift);animation:slideUp .18s ease}@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}.modal-card h3{font-size:1.1rem;margin-bottom:10px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.modal-actions button{flex:1}.confirm-modal p{color:var(--ink-soft);font-size:.9rem}.pay-total{font-family:var(--font-mono);font-size:2.2rem;font-weight:800;text-align:center;color:var(--green-dark);margin:6px 0 14px}.pay-methods{display:flex;gap:8px;margin-bottom:14px}.pay-method{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--paper);font-weight:700}.pay-method.active{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}.quick-amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.quick-amt{flex:1;min-width:70px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--paper);font-family:var(--font-mono);font-weight:700}.cash-received-label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:10px}.cash-received-label input{border:1px solid var(--border);border-radius:8px;padding:12px;font-size:1.1rem;font-family:var(--font-mono)}.change-row{display:flex;justify-content:space-between;background:var(--spice-light);border-radius:8px;padding:10px 14px;font-weight:700;color:var(--spice);font-family:var(--font-mono)}.keypad-display{font-family:var(--font-mono);font-size:2.4rem;font-weight:800;text-align:right;padding:10px 6px;border-bottom:2px solid var(--border);margin-bottom:12px}.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad-key{padding:16px;border-radius:8px;border:1px solid var(--border);background:var(--paper);font-size:1.2rem;font-weight:700}.success-badge{background:var(--green-light);color:var(--green-dark);text-align:center;padding:8px;border-radius:8px;font-weight:700;margin-bottom:12px;font-size:.85rem}.receipt{font-family:var(--font-mono);font-size:.82rem;color:var(--ink);background:var(--paper);border:1px dashed var(--border);border-radius:8px;padding:14px}.rc-store{font-weight:800;text-align:center;font-size:1rem}.rc-sub{text-align:center;color:var(--ink-soft);font-size:.72rem}.rc-divider{border-top:1px dashed var(--border);margin:8px 0}.rc-meta{font-size:.72rem;color:var(--ink-soft)}.rc-line{padding:4px 0}.rc-line-name{font-weight:700}.rc-line-detail{display:flex;justify-content:space-between;color:var(--ink-soft)}.rc-line-detail span{color:var(--ink);font-weight:700}.rc-row{display:flex;justify-content:space-between;padding:2px 0}.rc-total{font-weight:800;font-size:1rem;border-top:1px solid var(--ink);margin-top:4px;padding-top:6px}.rc-footer{text-align:center;margin-top:10px;font-weight:700}
.image-preview{width:100%;height:160px;object-fit:contain;border:1px dashed var(--border);border-radius:8px;background:var(--paper);display:none}.image-upload-box{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--paper)}.image-upload-title{font-weight:700}.image-upload-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.image-pick-btn{min-height:46px;touch-action:manipulation}.native-file-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}.image-file-name{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.image-tools{display:flex;gap:8px;flex-wrap:wrap}.image-tools .btn-secondary{flex:1}.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .2s ease;z-index:200}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.show.error{background:var(--danger)}
.print-only{display:none}@media print{#app,.modal-root,#modal-root{display:none!important}.print-only{display:block!important}body{background:#fff}}
@media(min-width:720px){.datetime{display:inline}.view{padding:20px 24px}}@media(max-width:720px){.vente-layout{flex-direction:column}.vente-products{height:auto;flex:none}#product-grid{overflow:visible;max-height:none}.vente-cart{max-width:none;min-width:0;height:auto}.ticket{height:auto}.cart-items{max-height:220px}.hist-columns{grid-template-columns:1fr}.cashier-select{max-width:110px}.form-grid{grid-template-columns:1fr}.form-grid label.span2{grid-column:1}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><div class="topbar-left"><span class="logo-mark">SC</span><span id="store-name-label" class="store-name">Souk Caisse</span></div><div class="topbar-right"><span id="datetime-label" class="datetime"></span><select id="cashier-input" class="cashier-select" title="Caissier"></select></div></header>
<main id="views">
<section id="view-vente" class="view active"><div class="vente-layout"><div class="vente-products"><div class="search-row"><input id="search-input" type="text" placeholder="Rechercher ou scanner un code-barres…" autocomplete="off"><button id="scan-btn" class="scan-btn" title="Scanner avec caméra">📷</button></div><div id="category-chips" class="chips"></div><div id="product-grid"></div></div><aside class="vente-cart"><div class="ticket"><div class="ticket-head"><span id="ticket-number">Ticket</span><button id="clear-cart-btn" class="link-btn">Vider</button></div><div id="cart-items" class="cart-items"></div><div class="cart-empty" id="cart-empty">Le panier est vide</div><div class="discount-row"><select id="discount-type"><option value="none">Aucune remise</option><option value="percent">Remise %</option><option value="amount">Remise (montant)</option></select><input id="discount-value" type="number" min="0" step="0.01" placeholder="0" disabled></div><div class="cart-totals"><div class="row"><span>Sous-total</span><span id="cart-subtotal">0,00</span></div><div class="row discount-line" id="discount-line" style="display:none"><span>Remise</span><span id="cart-discount">0,00</span></div><div class="row total"><span>Total</span><span id="cart-total">0,00</span></div></div><button id="checkout-btn" class="btn-primary btn-large" disabled>Encaisser</button></div></aside></div></section>
<section id="view-produits" class="view"><div class="view-header"><h2>Produits</h2><button id="add-product-btn" class="btn-primary">+ Nouveau produit</button></div><div class="search-row two-col"><input id="product-search" type="text" placeholder="Rechercher un produit…"><select id="product-category-filter"><option value="all">Toutes catégories</option></select></div><div id="products-table" class="products-table"></div></section>
<section id="view-historique" class="view"><div class="view-header"><h2>Historique &amp; Statistiques</h2><button id="export-xls-btn" class="btn-primary">📊 Exporter XLS</button></div><div class="chips" id="date-filter-chips"><button class="chip active" data-range="today">Aujourd'hui</button><button class="chip" data-range="7d">7 jours</button><button class="chip" data-range="30d">30 jours</button><button class="chip" data-range="all">Tout</button></div><div class="stat-cards" id="stat-cards"></div><div class="hist-columns"><div class="top-products"><h3>Meilleures ventes</h3><div id="top-products-list"></div></div><div class="sales-list-wrap"><h3>Tickets</h3><div id="sales-list"></div></div></div></section>
<section id="view-parametres" class="view"><div class="view-header"><h2>Paramètres</h2></div><div class="settings-grid">
<div class="settings-card"><h3>Boutique</h3><form id="settings-form" class="form-grid"><label class="span2">Nom du magasin<input id="set-storeName" type="text"></label><label class="span2">Adresse<input id="set-address" type="text"></label><label>Téléphone<input id="set-phone" type="text"></label><label>Devise<input id="set-currency" type="text" maxlength="6"></label><label class="span2">Message en bas de ticket<input id="set-footer" type="text"></label><div class="modal-actions span2"><button type="submit" class="btn-primary">Enregistrer</button></div></form></div>
<div class="settings-card"><h3>Caissiers</h3><div id="cashiers-manager"></div><div class="add-category-row"><input id="new-cashier-name" type="text" placeholder="Nom du caissier"><button id="add-cashier-btn" class="btn-secondary">Ajouter</button></div></div>
<div class="settings-card"><h3>Catégories</h3><div id="categories-manager"></div><div class="add-category-row"><input id="new-category-name" type="text" placeholder="Nouvelle catégorie"><div id="new-category-colors" class="color-swatches"></div><button id="add-category-btn" class="btn-secondary">Ajouter</button></div></div>
<div class="settings-card"><h3>Données</h3><p class="muted">Sauvegarde locale. Les images sont compressées avant stockage.</p><div class="data-actions"><button id="export-data-btn" class="btn-secondary">Exporter JSON</button><label class="btn-secondary file-btn">Importer<input id="import-data-input" type="file" accept="application/json" hidden></label><button id="reset-data-btn" class="btn-danger">Réinitialiser</button></div></div>
</div></section>
</main>

<script>
const DB_KEYS={products:'sc_products',categories:'sc_categories',sales:'sc_sales',settings:'sc_settings',ticketSeq:'sc_ticket_seq',cashiers:'sc_cashiers'};
const DEFAULT_CATEGORIES=[['cat_fl','Fruits & Légumes','#2F6B4F'],['cat_ep','Épicerie','#C77D2E'],['cat_cn','Conserves & Pâtes','#4A7A5E'],['cat_bo','Boissons','#2E6E8E'],['cat_lt','Produits laitiers','#8E5B2E'],['cat_pn','Boulangerie','#A65D2E'],['cat_sn','Snacks & Confiserie','#9C3F6B'],['cat_hy','Hygiène & Entretien','#6B4E8E'],['cat_au','Autres','#5A6B63']].map(x=>({id:x[0],name:x[1],color:x[2]}));
const DEFAULT_SETTINGS={storeName:'Souk Caisse',address:'',phone:'',currency:'DH',footer:'Merci de votre visite !',lowStockDefault:5};
const SWATCHES=['#2F6B4F','#C77D2E','#2E6E8E','#8E5B2E','#A65D2E','#6B4E8E','#5A6B63','#B23A3A'];
function uid(p='id'){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const DB={_read(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}},_write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Stockage local plein. Réduisez la taille des images.',true);return false}},getProducts(){return this._read(DB_KEYS.products,[])},saveProducts(v){return this._write(DB_KEYS.products,v)},getCategories(){return this._read(DB_KEYS.categories,[])},saveCategories(v){return this._write(DB_KEYS.categories,v)},getSales(){return this._read(DB_KEYS.sales,[])},saveSales(v){return this._write(DB_KEYS.sales,v)},getCashiers(){return this._read(DB_KEYS.cashiers,[])},saveCashiers(v){return this._write(DB_KEYS.cashiers,v)},getSettings(){return Object.assign({},DEFAULT_SETTINGS,this._read(DB_KEYS.settings,{}))},saveSettings(v){return this._write(DB_KEYS.settings,v)},nextTicketNumber(){let n=this._read(DB_KEYS.ticketSeq,0)+1;this._write(DB_KEYS.ticketSeq,n);return n},exportAll(){return{products:this.getProducts(),categories:this.getCategories(),sales:this.getSales(),cashiers:this.getCashiers(),settings:this.getSettings(),exportedAt:new Date().toISOString(),app:'souk-caisse',version:2}},importAll(d){if(!d||typeof d!=='object')throw Error('Fichier invalide');if(Array.isArray(d.products))this.saveProducts(d.products);if(Array.isArray(d.categories))this.saveCategories(d.categories);if(Array.isArray(d.sales))this.saveSales(d.sales);if(Array.isArray(d.cashiers))this.saveCashiers(d.cashiers);if(d.settings)this.saveSettings(Object.assign({},DEFAULT_SETTINGS,d.settings))},resetAll(){Object.values(DB_KEYS).forEach(k=>localStorage.removeItem(k));seedIfEmpty(true)}};
function seedIfEmpty(force){if(force||DB.getCategories().length===0)DB.saveCategories(DEFAULT_CATEGORIES);if(force||!localStorage.getItem(DB_KEYS.settings))DB.saveSettings(Object.assign({},DEFAULT_SETTINGS));if(force||!localStorage.getItem(DB_KEYS.cashiers))DB.saveCashiers(['Amine']);if(force||DB.getProducts().length===0){const demo=[['Tomates','cat_fl',6.5,'kg',40,''],['Pommes de terre','cat_fl',4.5,'kg',60,''],['Oignons','cat_fl',5,'kg',50,''],['Carottes','cat_fl',4,'kg',35,''],['Courgettes','cat_fl',5.5,'kg',30,''],['Concombre','cat_fl',4.5,'kg',25,''],['Poivrons','cat_fl',8,'kg',20,''],['Aubergines','cat_fl',5,'kg',25,''],['Oranges','cat_fl',7,'kg',35,''],['Bananes','cat_fl',9,'kg',25,''],['Pommes','cat_fl',10,'kg',30,''],['Huile d’olive 1L','cat_ep',65,'unite',20,'6111000000011'],['Riz 1kg','cat_ep',12,'unite',30,'6111000000013'],['Sucre 1kg','cat_ep',8.5,'unite',40,'6111000000014'],['Pâtes spaghetti 500g','cat_cn',7,'unite',35,'6111000000027'],['Eau minérale 1.5L','cat_bo',5,'unite',60,'6111000000037'],['Coca-Cola 1.5L','cat_bo',12,'unite',30,'6111000000040'],['Lait 1L','cat_lt',7.5,'unite',30,'6111000000047'],['Pain','cat_pn',1.5,'unite',80,''],['Chips (paquet)','cat_sn',8,'unite',30,'6111000000057'],['Savon liquide 500ml','cat_hy',18,'unite',16,'6111000000066'],['Javel 1L','cat_hy',8,'unite',20,'6111000000074']].map(x=>({id:uid('p'),active:true,name:x[0],category:x[1],price:x[2],unit:x[3],stock:x[4],minStock:5,barcode:x[5],image:''}));DB.saveProducts(demo)}}
const state={view:'vente',products:[],categories:[],sales:[],cashiers:[],settings:{},cart:[],searchTerm:'',activeCategory:'all',discountType:'none',discountValue:0,cashierName:'',productFilterCategory:'all',productSearch:'',dateRange:'today',editingProductId:null,newCategoryColor:'#2F6B4F'};
function fmtMoney(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+state.settings.currency}function fmtQty(n,u){const v=Number(n||0);return(u==='kg'||u==='l')?v.toLocaleString('fr-FR',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:3}):String(Math.round(v))}function unitLabel(u){return{unite:'unité',kg:'kg',g:'g',l:'L'}[u]||u}function catById(id){return state.categories.find(c=>c.id===id)}function catName(id){return catById(id)?.name||'Autre'}function catColor(id){return catById(id)?.color||'#5A6B63'}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function loadAll(){state.products=DB.getProducts();state.categories=DB.getCategories();state.sales=DB.getSales();state.cashiers=DB.getCashiers();state.settings=DB.getSettings();state.cashierName=state.cashierName||state.cashiers[0]||''}
document.addEventListener('DOMContentLoaded',()=>{seedIfEmpty(false);loadAll();bindEvents();renderAll();tickClock();setInterval(tickClock,30000)});
function tickClock(){const e=document.getElementById('datetime-label');if(e)e.textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function renderTopbar(){document.getElementById('store-name-label').textContent=state.settings.storeName||'Souk Caisse';const s=document.getElementById('cashier-input');s.innerHTML=state.cashiers.map(n=>`<option>${escapeHtml(n)}</option>`).join('')||'<option>—</option>';s.value=state.cashierName||state.cashiers[0]||''}
function bindEvents(){
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
document.getElementById('cashier-input').onchange=e=>state.cashierName=e.target.value;
document.getElementById('search-input').oninput=e=>{state.searchTerm=e.target.value;maybeAutoAddByBarcode(e.target.value);renderProductGrid()};document.getElementById('search-input').onkeydown=e=>{if(e.key==='Enter'){if(maybeAutoAddByBarcode(e.target.value,true)){e.target.value='';state.searchTerm='';renderProductGrid()}}};
document.getElementById('scan-btn').onclick=()=>openBarcodeScanner({subtitle:'Visez le code-barres du produit à ajouter',onResult:handleBarcode});
document.getElementById('clear-cart-btn').onclick=()=>{if(state.cart.length)confirmDialog('Vider le panier ?','Tous les articles seront retirés.',()=>{state.cart=[];state.discountType='none';state.discountValue=0;document.getElementById('discount-type').value='none';document.getElementById('discount-value').value='';document.getElementById('discount-value').disabled=true;renderCart()})};
document.getElementById('discount-type').onchange=e=>{state.discountType=e.target.value;document.getElementById('discount-value').disabled=e.target.value==='none';if(e.target.value==='none')state.discountValue=0;renderCart()};document.getElementById('discount-value').oninput=e=>{state.discountValue=parseFloat(e.target.value)||0;renderCart()};document.getElementById('checkout-btn').onclick=openPaymentModal;
document.getElementById('add-product-btn').onclick=()=>openProductForm(null);document.getElementById('product-search').oninput=e=>{state.productSearch=e.target.value;renderProductsTable()};document.getElementById('product-category-filter').onchange=e=>{state.productFilterCategory=e.target.value;renderProductsTable()};
document.querySelectorAll('#date-filter-chips .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#date-filter-chips .chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');state.dateRange=c.dataset.range;renderHistorique()});
document.getElementById('export-xls-btn').onclick=exportXLS;
document.getElementById('settings-form').onsubmit=e=>{e.preventDefault();state.settings.storeName=document.getElementById('set-storeName').value.trim()||'Souk Caisse';state.settings.address=document.getElementById('set-address').value.trim();state.settings.phone=document.getElementById('set-phone').value.trim();state.settings.currency=document.getElementById('set-currency').value.trim()||'DH';state.settings.footer=document.getElementById('set-footer').value.trim();DB.saveSettings(state.settings);renderTopbar();toast('Paramètres enregistrés')};
document.getElementById('add-cashier-btn').onclick=()=>{const i=document.getElementById('new-cashier-name'),n=i.value.trim();if(!n)return;if(state.cashiers.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Ce caissier existe déjà',true);state.cashiers.push(n);DB.saveCashiers(state.cashiers);state.cashierName=n;i.value='';renderCashiers();renderTopbar();toast('Caissier ajouté')};
document.getElementById('add-category-btn').onclick=()=>{const i=document.getElementById('new-category-name'),n=i.value.trim();if(!n)return;state.categories.push({id:uid('cat'),name:n,color:state.newCategoryColor});DB.saveCategories(state.categories);i.value='';renderCategoriesManager();renderCategoryChips();populateCategorySelects()};
document.getElementById('export-data-btn').onclick=exportData;document.getElementById('import-data-input').onchange=importData;document.getElementById('reset-data-btn').onclick=()=>confirmDialog('Réinitialiser toutes les données ?','Produits, ventes, réglages et caissiers seront effacés.',()=>{DB.resetAll();loadAll();renderAll();toast('Données réinitialisées')},'danger')
}
function switchView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('view-'+v).classList.add('active');renderAll()}
function renderAll(){renderTopbar();if(state.view==='vente'){renderCategoryChips();renderProductGrid();renderCart();document.getElementById('ticket-number').textContent='Ticket #'+(DB._read(DB_KEYS.ticketSeq,0)+1)}if(state.view==='produits'){populateCategorySelects();renderProductsTable()}if(state.view==='historique')renderHistorique();if(state.view==='parametres')renderParametres()}
function renderCategoryChips(){const w=document.getElementById('category-chips');w.innerHTML=[{id:'all',name:'Tout',color:'#1F2A24'},...state.categories].map(c=>`<button class="chip ${state.activeCategory===c.id?'active':''}" data-cat="${c.id}" style="--chip-color:${c.color}">${escapeHtml(c.name)}</button>`).join('');w.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.activeCategory=c.dataset.cat;renderCategoryChips();renderProductGrid()})}
function filteredVenteProducts(){const t=state.searchTerm.trim().toLowerCase();return state.products.filter(p=>p.active!==false&&(state.activeCategory==='all'||p.category===state.activeCategory)&&(!t||(p.name||'').toLowerCase().includes(t)||(p.barcode||'').includes(t)))}
function maybeAutoAddByBarcode(v,force=false){v=(v||'').trim();if(v.length<3)return false;const p=state.products.find(x=>x.barcode&&x.barcode===v);if(p&&(force||v.length>=8)){addToCart(p,1);toast(p.name+' ajouté au panier');return true}return false}
function handleBarcode(code){const p=state.products.find(x=>x.barcode&&x.barcode===code);if(p){addToCart(p,1);toast(p.name+' ajouté au panier')}else confirmDialog('Produit inconnu',`Aucun produit ne correspond au code ${code}. Créer le produit ?`,()=>{openProductForm(null);setTimeout(()=>{const e=document.getElementById('pf-barcode');if(e)e.value=code},50)})}
function renderProductGrid(){const g=document.getElementById('product-grid'),list=filteredVenteProducts();if(!list.length){g.innerHTML='<div class="empty-state">Aucun produit trouvé.</div>';return}g.innerHTML=list.map(p=>{const low=p.stock<=(p.minStock||0);return`<button class="product-card" data-id="${p.id}" style="--cat-color:${catColor(p.category)}">${p.image?`<img class="pc-image" src="${p.image}" alt="">`:'<div class="pc-placeholder">🛍️</div>'}<span class="pc-cat">${escapeHtml(catName(p.category))}</span><span class="pc-name">${escapeHtml(p.name)}</span><span class="pc-price">${fmtMoney(p.price)}<small>/${unitLabel(p.unit)}</small></span><span class="pc-stock ${low?'low':''}">${low?'⚠ ':''}Stock : ${fmtQty(p.stock,p.unit)}</span></button>`}).join('');g.querySelectorAll('.product-card').forEach(c=>c.onclick=()=>{const p=state.products.find(x=>x.id===c.dataset.id);if(p.unit==='kg'||p.unit==='g'||p.unit==='l')openKeypadModal({title:p.name,subtitle:`Quantité (${unitLabel(p.unit)}) — ${fmtMoney(p.price)}/${unitLabel(p.unit)}`,initial:'1',allowDecimal:true,onConfirm:v=>v>0&&addToCart(p,v)});else addToCart(p,1)})}
function addToCart(p,q){const x=state.cart.find(i=>i.productId===p.id);if(x)x.qty+=q;else state.cart.push({productId:p.id,name:p.name,unit:p.unit,price:p.price,qty:q});renderCart()}
function computeTotals(){const subtotal=state.cart.reduce((s,i)=>s+i.price*i.qty,0);let discount=state.discountType==='percent'?subtotal*Math.min(state.discountValue,100)/100:state.discountType==='amount'?Math.min(state.discountValue,subtotal):0;return{subtotal,discount,total:Math.max(0,subtotal-discount)}}
function renderCart(){const e=document.getElementById('cart-items'),empty=document.getElementById('cart-empty');empty.style.display=state.cart.length?'none':'block';e.innerHTML=state.cart.map((i,k)=>`<div class="cart-item"><div class="ci-main"><span class="ci-name">${escapeHtml(i.name)}</span><span class="ci-unitprice">${fmtMoney(i.price)} / ${unitLabel(i.unit)}</span></div><div class="ci-qty"><button class="qty-btn" data-i="${k}" data-a="dec">−</button><span class="qty-val">${fmtQty(i.qty,i.unit)}</span><button class="qty-btn" data-i="${k}" data-a="inc">+</button></div><div class="ci-total">${fmtMoney(i.price*i.qty)}</div><button class="ci-remove" data-i="${k}">✕</button></div>`).join('');e.querySelectorAll('.qty-btn').forEach(b=>b.onclick=()=>{const i=state.cart[+b.dataset.i],step=(i.unit==='kg'||i.unit==='l')?.5:1;i.qty=b.dataset.a==='inc'?i.qty+step:Math.max(step,i.qty-step);renderCart()});e.querySelectorAll('.ci-remove').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.i,1);renderCart()});const t=computeTotals();document.getElementById('cart-subtotal').textContent=fmtMoney(t.subtotal);document.getElementById('cart-discount').textContent='− '+fmtMoney(t.discount);document.getElementById('discount-line').style.display=t.discount?'flex':'none';document.getElementById('cart-total').textContent=fmtMoney(t.total);document.getElementById('checkout-btn').disabled=!state.cart.length}
function suggestedCashAmounts(t){const a=new Set([Math.ceil(t/10)*10]);[20,50,100,200].forEach(x=>x>=t&&a.add(x));return[...a].sort((a,b)=>a-b).slice(0,4)}
function openPaymentModal(){const{total}=computeTotals();openModal(`<div class="modal-card payment-modal"><h3>Encaissement</h3><div class="pay-total">${fmtMoney(total)}</div><div class="pay-methods"><button class="pay-method active" data-method="especes">Espèces</button><button class="pay-method" data-method="carte">Carte</button></div><div id="cash-section"><div class="quick-amounts">${suggestedCashAmounts(total).map(a=>`<button class="quick-amt" data-amt="${a}">${fmtMoney(a)}</button>`).join('')}</div><label class="cash-received-label">Montant reçu<input id="cash-received" type="number" step=".01" min="0"></label><div class="change-row"><span>Monnaie à rendre</span><span id="change-amount">${fmtMoney(0)}</span></div></div><div class="modal-actions"><button class="btn-secondary" id="cancel-payment">Annuler</button><button class="btn-primary" id="confirm-payment" disabled>Valider le paiement</button></div></div>`);let method='especes';const m=document.querySelector('.payment-modal'),cash=m.querySelector('#cash-section'),inp=m.querySelector('#cash-received'),ok=m.querySelector('#confirm-payment'),ch=m.querySelector('#change-amount');const upd=()=>{if(method==='carte'){ok.disabled=false;ch.textContent=fmtMoney(0);return}const r=parseFloat(inp.value)||0;ch.textContent=fmtMoney(Math.max(0,r-total));ok.disabled=r<total-.001};m.querySelectorAll('.pay-method').forEach(b=>b.onclick=()=>{m.querySelectorAll('.pay-method').forEach(x=>x.classList.remove('active'));b.classList.add('active');method=b.dataset.method;cash.style.display=method==='especes'?'block':'none';upd()});m.querySelectorAll('.quick-amt').forEach(b=>b.onclick=()=>{inp.value=b.dataset.amt;upd()});inp.oninput=upd;m.querySelector('#cancel-payment').onclick=closeModal;ok.onclick=()=>finalizeSale(method,method==='carte'?total:(parseFloat(inp.value)||0))}
function finalizeSale(method,received){const t=computeTotals(),sale={id:uid('sale'),number:DB.nextTicketNumber(),date:new Date().toISOString(),cashier:state.cashierName||'—',items:state.cart.map(i=>({...i,lineTotal:i.price*i.qty})),subtotal:t.subtotal,discount:t.discount,total:t.total,payment:{method,received,change:Math.max(0,received-t.total)}};state.sales.push(sale);DB.saveSales(state.sales);sale.items.forEach(i=>{const p=state.products.find(x=>x.id===i.productId);if(p)p.stock=Math.max(0,+(p.stock-i.qty).toFixed(3))});DB.saveProducts(state.products);state.cart=[];state.discountType='none';state.discountValue=0;closeModal();showReceiptModal(sale,true);renderCart();renderProductGrid()}
function buildReceiptHTML(s){const st=state.settings;return`<div class="receipt"><div class="rc-store">${escapeHtml(st.storeName)}</div>${st.address?`<div class="rc-sub">${escapeHtml(st.address)}</div>`:''}${st.phone?`<div class="rc-sub">${escapeHtml(st.phone)}</div>`:''}<div class="rc-divider"></div><div class="rc-meta">Ticket #${s.number} — ${new Date(s.date).toLocaleString('fr-FR')}</div><div class="rc-meta">Caissier : ${escapeHtml(s.cashier)}</div><div class="rc-divider"></div>${s.items.map(i=>`<div class="rc-line"><div class="rc-line-name">${escapeHtml(i.name)}</div><div class="rc-line-detail">${fmtQty(i.qty,i.unit)} ${unitLabel(i.unit)} x ${fmtMoney(i.price)} <span>${fmtMoney(i.lineTotal)}</span></div></div>`).join('')}<div class="rc-divider"></div><div class="rc-row"><span>Sous-total</span><span>${fmtMoney(s.subtotal)}</span></div>${s.discount?`<div class="rc-row"><span>Remise</span><span>− ${fmtMoney(s.discount)}</span></div>`:''}<div class="rc-row rc-total"><span>TOTAL</span><span>${fmtMoney(s.total)}</span></div><div class="rc-row"><span>${s.payment.method==='carte'?'Carte':'Espèces reçues'}</span><span>${fmtMoney(s.payment.received)}</span></div>${s.payment.method==='especes'?`<div class="rc-row"><span>Monnaie rendue</span><span>${fmtMoney(s.payment.change)}</span></div>`:''}<div class="rc-divider"></div><div class="rc-footer">${escapeHtml(st.footer||'Merci de votre visite !')}</div></div>`}
function showReceiptModal(s,newSale){openModal(`<div class="modal-card">${newSale?'<div class="success-badge">✓ Vente enregistrée</div>':''}${buildReceiptHTML(s)}<div class="modal-actions"><button class="btn-secondary" id="r-close">${newSale?'Nouvelle vente':'Fermer'}</button><button class="btn-primary" id="r-print">Imprimer</button></div></div>`);document.getElementById('r-close').onclick=closeModal;document.getElementById('r-print').onclick=()=>{document.getElementById('print-area').innerHTML=buildReceiptHTML(s);window.print()}}
function populateCategorySelects(){const f=document.getElementById('product-category-filter'),cur=f.value||'all';f.innerHTML='<option value="all">Toutes catégories</option>'+state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');f.value=cur}
function renderProductsTable(){const w=document.getElementById('products-table'),t=state.productSearch.trim().toLowerCase(),list=state.products.filter(p=>(state.productFilterCategory==='all'||p.category===state.productFilterCategory)&&(!t||(p.name||'').toLowerCase().includes(t)));if(!list.length){w.innerHTML='<div class="empty-state">Aucun produit.</div>';return}w.innerHTML='<div class="pt-row pt-head"><span>Produit</span><span>Catégorie</span><span>Prix</span><span>Stock</span><span></span></div>'+list.map(p=>`<div class="pt-row"><span class="pt-name">${p.image?`<img class="pt-thumb" src="${p.image}">`:'🛍️'}<span>${escapeHtml(p.name)}${p.barcode?`<small>${escapeHtml(p.barcode)}</small>`:''}</span></span><span>${escapeHtml(catName(p.category))}</span><span>${fmtMoney(p.price)}/${unitLabel(p.unit)}</span><span class="${p.stock<=(p.minStock||0)?'low-text':''}">${fmtQty(p.stock,p.unit)} ${unitLabel(p.unit)}</span><span class="pt-actions"><button class="icon-btn" data-edit="${p.id}">✎</button><button class="icon-btn danger" data-del="${p.id}">🗑</button></span></div>`).join('');w.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProductForm(b.dataset.edit));w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.id===b.dataset.del);confirmDialog('Supprimer ce produit ?',`"${p.name}" sera supprimé.`,()=>{state.products=state.products.filter(x=>x.id!==p.id);DB.saveProducts(state.products);renderProductsTable();toast('Produit supprimé')},'danger')})}
function compressImage(file,max=700,quality=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',quality))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function openProductForm(id){const p=id?state.products.find(x=>x.id===id):null;openModal(`<div class="modal-card"><h3>${p?'Modifier le produit':'Nouveau produit'}</h3><form id="product-form" class="form-grid"><label>Nom<input id="pf-name" required value="${p?escapeHtml(p.name):''}"></label><label>Catégorie<select id="pf-category">${state.categories.map(c=>`<option value="${c.id}" ${p&&p.category===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><label>Prix (${state.settings.currency})<input id="pf-price" type="number" min="0" step=".01" required value="${p?p.price:''}"></label><label>Unité<select id="pf-unit"><option value="unite">Unité</option><option value="kg">Kilogramme (kg)</option><option value="g">Gramme (g)</option><option value="l">Litre (L)</option></select></label><label>Stock<input id="pf-stock" type="number" min="0" step=".01" value="${p?p.stock:0}"></label><label>Seuil d'alerte<input id="pf-minstock" type="number" min="0" step=".01" value="${p?p.minStock||0:5}"></label><label class="span2">Code-barres<div class="barcode-field-row"><input id="pf-barcode" value="${p?escapeHtml(p.barcode||''):''}"><button type="button" id="pf-scan-btn" class="scan-btn small">📷</button></div></label><div class="span2 image-upload-box"><div class="image-upload-title">Image du produit</div><div class="image-upload-actions"><button type="button" class="btn-secondary image-pick-btn" id="pick-gallery">🖼️ Galerie</button><button type="button" class="btn-secondary image-pick-btn" id="pick-camera">📷 Caméra</button></div><input id="pf-image-file" class="native-file-input" type="file" accept="image/*"><input id="pf-camera-file" class="native-file-input" type="file" accept="image/*" capture="environment"><div id="image-file-name" class="image-file-name">Aucune image sélectionnée</div><img id="image-preview" class="image-preview" ${p&&p.image?'src="'+p.image+'" style="display:block"':''}><div class="image-tools"><button type="button" class="btn-secondary" id="remove-image">Supprimer image</button></div></div><div class="modal-actions span2"><button type="button" class="btn-secondary" id="cancel-product">Annuler</button><button type="button" class="btn-primary" id="save-product-btn">${p?'Enregistrer':'Ajouter'}</button></div></form></div>`);document.getElementById('pf-unit').value=p?.unit||'unite';let image=p?.image||'';const fileName=document.getElementById('image-file-name');const preview=document.getElementById('image-preview');async function useImage(file){if(!file)return;try{image=await compressImage(file);preview.src=image;preview.style.display='block';fileName.textContent='Image sélectionnée : '+file.name}catch(err){console.error(err);toast('Impossible de lire cette image',true)}}function openNativePicker(input){try{if(input.showPicker)input.showPicker();else input.click()}catch(e){input.click()}}const galleryInput=document.getElementById('pf-image-file'),cameraInput=document.getElementById('pf-camera-file');document.getElementById('pick-gallery').onclick=()=>openNativePicker(galleryInput);document.getElementById('pick-camera').onclick=()=>openNativePicker(cameraInput);galleryInput.onchange=e=>useImage(e.target.files&&e.target.files[0]);cameraInput.onchange=e=>useImage(e.target.files&&e.target.files[0]);if(p&&p.image)fileName.textContent='Image actuelle';document.getElementById('remove-image').onclick=()=>{image='';preview.src='';preview.style.display='none';galleryInput.value='';cameraInput.value='';fileName.textContent='Aucune image sélectionnée'};document.getElementById('cancel-product').onclick=closeModal;document.getElementById('pf-scan-btn').onclick=()=>openBarcodeScanner({subtitle:'Visez le code-barres du produit',onResult:c=>{const e=document.getElementById('pf-barcode');if(e)e.value=c}});const saveProduct=()=>{try{const name=document.getElementById('pf-name').value.trim();const priceEl=document.getElementById('pf-price');const price=parseFloat(priceEl.value);if(!name){toast('Veuillez saisir le nom du produit',true);document.getElementById('pf-name').focus();return}if(!Number.isFinite(price)||price<0){toast('Veuillez saisir un prix valide',true);priceEl.focus();return}const d={name,category:document.getElementById('pf-category').value,price,unit:document.getElementById('pf-unit').value,stock:Math.max(0,parseFloat(document.getElementById('pf-stock').value)||0),minStock:Math.max(0,parseFloat(document.getElementById('pf-minstock').value)||0),barcode:document.getElementById('pf-barcode').value.trim(),image:image||'',active:true};const before=state.products.slice();let nextProducts;if(p){nextProducts=state.products.map(x=>x.id===p.id?Object.assign({},x,d):x)}else{nextProducts=state.products.concat(Object.assign({id:uid('p')},d))}if(!DB.saveProducts(nextProducts)){state.products=before;toast('Impossible d’enregistrer le produit. Libérez de l’espace de stockage.',true);return}state.products=nextProducts;closeModal();renderProductsTable();renderProductGrid();toast(p?'Produit mis à jour avec succès':'Produit ajouté avec succès')}catch(err){console.error(err);toast('Erreur lors de l’enregistrement du produit',true)}};document.getElementById('save-product-btn').onclick=saveProduct;document.getElementById('product-form').onsubmit=e=>{e.preventDefault();saveProduct()}}
function salesInRange(){const n=new Date();let f=null;if(state.dateRange==='today')f=new Date(n.getFullYear(),n.getMonth(),n.getDate());else if(state.dateRange==='7d')f=new Date(n.getTime()-7*864e5);else if(state.dateRange==='30d')f=new Date(n.getTime()-30*864e5);return state.sales.filter(s=>!f||new Date(s.date)>=f).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function renderHistorique(){const l=salesInRange(),rev=l.reduce((s,x)=>s+x.total,0),count=l.length;document.getElementById('stat-cards').innerHTML=`<div class="stat-card"><span class="stat-label">Chiffre d'affaires</span><span class="stat-value">${fmtMoney(rev)}</span></div><div class="stat-card"><span class="stat-label">Tickets</span><span class="stat-value">${count}</span></div><div class="stat-card"><span class="stat-label">Panier moyen</span><span class="stat-value">${fmtMoney(count?rev/count:0)}</span></div>`;const pt={};l.forEach(s=>s.items.forEach(i=>{pt[i.name]??={qty:0,revenue:0,unit:i.unit};pt[i.name].qty+=i.qty;pt[i.name].revenue+=i.lineTotal}));const top=Object.entries(pt).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,5);document.getElementById('top-products-list').innerHTML=top.length?top.map(([n,d],i)=>`<div class="top-product-row"><span class="tp-rank">${i+1}</span><span>${escapeHtml(n)}</span><span class="tp-qty">${fmtQty(d.qty,d.unit)} ${unitLabel(d.unit)}</span><span class="tp-revenue">${fmtMoney(d.revenue)}</span></div>`).join(''):'<div class="empty-state">Aucune vente.</div>';const sl=document.getElementById('sales-list');sl.innerHTML=l.length?l.map(s=>`<div class="sale-row" data-id="${s.id}"><span class="sr-num">#${s.number}</span><span>${new Date(s.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span>${s.payment.method==='carte'?'💳':'💵'}</span><span class="sr-total">${fmtMoney(s.total)}</span></div>`).join(''):'<div class="empty-state">Aucun ticket.</div>';sl.querySelectorAll('.sale-row').forEach(r=>r.onclick=()=>showReceiptModal(state.sales.find(s=>s.id===r.dataset.id),false))}
function renderParametres(){document.getElementById('set-storeName').value=state.settings.storeName||'';document.getElementById('set-address').value=state.settings.address||'';document.getElementById('set-phone').value=state.settings.phone||'';document.getElementById('set-currency').value=state.settings.currency||'';document.getElementById('set-footer').value=state.settings.footer||'';renderCashiers();renderCategoriesManager();renderColorSwatches()}
function renderCashiers(){const w=document.getElementById('cashiers-manager');w.innerHTML=state.cashiers.length?state.cashiers.map((n,i)=>`<div class="cashier-row"><input class="cashier-name-input" data-i="${i}" value="${escapeHtml(n)}"><button class="icon-btn" data-savecash="${i}">✓</button><button class="icon-btn danger" data-delcash="${i}">🗑</button></div>`).join(''):'<div class="empty-state">Aucun caissier.</div>';w.querySelectorAll('[data-savecash]').forEach(b=>b.onclick=()=>{const i=+b.dataset.savecash,n=w.querySelector(`[data-i="${i}"]`).value.trim();if(!n)return;if(state.cashiers.some((x,j)=>j!==i&&x.toLowerCase()===n.toLowerCase()))return toast('Nom déjà utilisé',true);state.cashiers[i]=n;DB.saveCashiers(state.cashiers);if(state.cashierName===state.cashiers[i])state.cashierName=n;renderCashiers();renderTopbar();toast('Caissier modifié')});w.querySelectorAll('[data-delcash]').forEach(b=>b.onclick=()=>{if(state.cashiers.length<=1)return toast('Gardez au moins un caissier',true);const i=+b.dataset.delcash;confirmDialog('Supprimer ce caissier ?',`Supprimer "${state.cashiers[i]}" ?`,()=>{const old=state.cashiers[i];state.cashiers.splice(i,1);DB.saveCashiers(state.cashiers);if(state.cashierName===old)state.cashierName=state.cashiers[0];renderCashiers();renderTopbar() },'danger')})}
function renderCategoriesManager(){const w=document.getElementById('categories-manager');w.innerHTML=state.categories.map(c=>`<div class="cat-manage-row"><span style="width:9px;height:9px;border-radius:50%;background:${c.color}"></span><input class="cat-name-input" data-id="${c.id}" value="${escapeHtml(c.name)}"><button class="icon-btn danger" data-delcat="${c.id}">🗑</button></div>`).join('');w.querySelectorAll('.cat-name-input').forEach(i=>i.onchange=()=>{const c=catById(i.dataset.id);if(c&&i.value.trim()){c.name=i.value.trim();DB.saveCategories(state.categories);renderCategoryChips();populateCategorySelects();renderProductsTable()}});w.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{if(state.products.some(p=>p.category===b.dataset.delcat))return toast('Impossible : catégorie utilisée',true);state.categories=state.categories.filter(c=>c.id!==b.dataset.delcat);DB.saveCategories(state.categories);renderCategoriesManager();renderCategoryChips();populateCategorySelects()})}
function renderColorSwatches(){const w=document.getElementById('new-category-colors');w.innerHTML=SWATCHES.map(c=>`<button type="button" class="swatch ${c===state.newCategoryColor?'selected':''}" data-color="${c}" style="--sw:${c}"></button>`).join('');w.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{state.newCategoryColor=b.dataset.color;renderColorSwatches()})}
function exportData(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(DB.exportAll(),null,2)],{type:'application/json'}));a.href=u;a.download=`souk-caisse-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);confirmDialog('Importer cette sauvegarde ?','Les données actuelles seront remplacées.',()=>{DB.importAll(d);loadAll();renderAll();toast('Sauvegarde importée')})}catch{toast('Fichier invalide',true)}};r.readAsText(f);e.target.value=''}
function csvCell(v){v=String(v??'');return'"'+v.replace(/"/g,'""')+'"'}
function exportXLS(){const l=salesInRange();if(!l.length)return toast('Aucune vente à exporter',true);const rows=[['Statistiques Souk Caisse'],['Période',state.dateRange],[],['Ticket','Date','Caissier','Paiement','Sous-total','Remise','Total','Reçu','Monnaie'],...l.map(s=>[s.number,new Date(s.date).toLocaleString('fr-FR'),s.cashier,s.payment.method==='carte'?'Carte':'Espèces',s.subtotal,s.discount,s.total,s.payment.received,s.payment.change]),[],['Produit','Quantité','Unité','CA'],...Object.entries(l.flatMap(s=>s.items).reduce((a,i)=>(a[i.name]??={qty:0,unit:i.unit,revenue:0},a[i.name].qty+=i.qty,a[i.name].revenue+=i.lineTotal,a),{})).map(([n,d])=>[n,d.qty,unitLabel(d.unit),d.revenue])];const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');const blob=new Blob([csv],{type:'application/vnd.ms-excel;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`souk-caisse-statistiques-${new Date().toISOString().slice(0,10)}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Fichier XLS exporté')}
function openModal(h){document.getElementById('modal-root').innerHTML=`<div class="modal-overlay">${h}</div>`;document.querySelector('.modal-overlay').onclick=e=>e.target.classList.contains('modal-overlay')&&closeModal()}
let activeScanner=null;function closeModal(){stopActiveScanner();document.getElementById('modal-root').innerHTML=''}function confirmDialog(t,m,yes,tone){openModal(`<div class="modal-card confirm-modal"><h3>${escapeHtml(t)}</h3><p>${escapeHtml(m)}</p><div class="modal-actions"><button class="btn-secondary" id="cn">Annuler</button><button class="${tone==='danger'?'btn-danger':'btn-primary'}" id="cy">Confirmer</button></div></div>`);document.getElementById('cn').onclick=closeModal;document.getElementById('cy').onclick=()=>{closeModal();yes()}}
function openKeypadModal({title,subtitle,initial,allowDecimal,onConfirm}){let v=String(initial||'');openModal(`<div class="modal-card"><h3>${escapeHtml(title)}</h3><p class="muted">${escapeHtml(subtitle||'')}</p><div class="keypad-display" id="kd">${v}</div><div class="keypad-grid">${['1','2','3','4','5','6','7','8','9',allowDecimal?'.':'','0','⌫'].map(k=>`<button class="keypad-key" data-k="${k}">${k||' '}</button>`).join('')}</div><div class="modal-actions"><button class="btn-secondary" id="kc">Annuler</button><button class="btn-primary" id="ko">OK</button></div></div>`);document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!k)return;if(k==='⌫')v=v.slice(0,-1);else if(k==='.'&&v.includes('.'))return;else v+=k;document.getElementById('kd').textContent=v||'0'});document.getElementById('kc').onclick=closeModal;document.getElementById('ko').onclick=()=>{const n=parseFloat(v);closeModal();if(!isNaN(n))onConfirm(n)}}
function openBarcodeScanner({subtitle,onResult}){if(typeof Html5Qrcode==='undefined')return toast('Scanner caméra indisponible. Le lecteur externe reste utilisable.',true);openModal(`<div class="modal-card"><h3>Scanner un code-barres</h3><p class="muted">${escapeHtml(subtitle||'')}</p><div id="qr-reader"></div><div id="scanner-error" class="scanner-error" style="display:none"></div><div class="modal-actions"><button class="btn-secondary" id="sc">Annuler</button></div></div>`);document.getElementById('sc').onclick=closeModal;const formats=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.QR_CODE]:undefined;const s=new Html5Qrcode('qr-reader',formats?{formatsToSupport:formats,verbose:false}:undefined);activeScanner=s;s.start({facingMode:'environment'},{fps:12,qrbox:{width:260,height:160}},code=>{stopActiveScanner().then(()=>{closeModal();onResult(code)})},()=>{}).catch(()=>{const e=document.getElementById('scanner-error');if(e){e.style.display='block';e.textContent="Impossible d'accéder à la caméra. Vérifiez l'autorisation."}})}
function stopActiveScanner(){if(!activeScanner)return Promise.resolve();const s=activeScanner;activeScanner=null;return s.stop().then(()=>s.clear()).catch(()=>{})}
let toastTimer;function toast(msg,error=false){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=msg;e.className=error?'show error':'show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.className='',2200)}
</script>
</body></html>
