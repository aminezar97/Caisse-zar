name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: |
          npm run build || echo "No build script"
          mkdir -p www
          cp -r ./*.html ./*.htm ./assets ./images ./scripts ./vendor ./css ./js www/ 2>/dev/null || true
          if [ ! -f "www/index.html" ]; then
            first_html=$(ls *.html *.htm 2>/dev/null | head -1)
            [ -n "$first_html" ] && cp "$first_html" www/index.html
          fi
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Zarouali POS</h1>" > www/index.html
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup Java 21          # ← تغيير من 17 إلى 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zarouali-POS-APK
          path: android/app/build/outputs/apk/debug/*.apk
