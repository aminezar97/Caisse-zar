name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Ionic & Capacitor CLI
      run: npm install -g @ionic/cli @capacitor/cli

    - name: Install Project Dependencies
      run: |
        if [ -f package.json ]; then npm install; else npm init -y && npm install @capacitor/core @capacitor/android; fi

    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap copy android || true
        npx cap sync android || true

    - name: Build Android APK
      run: |
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Android directory not found!" && exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: caisse-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
