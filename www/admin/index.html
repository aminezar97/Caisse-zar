<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zarouali Caisse — Admin</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--text:#11180d;--muted:#687260;--line:#e0e6d8;--g:#5a8f2d;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;object-fit:contain;background:#fff}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted)}
button,input{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.primary{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel,.login{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #14200a12}.card{padding:18px}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:28px;font-weight:900;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{overflow:hidden}.ph{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:900}.body{padding:10px 18px 18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase}.low{color:var(--r);font-weight:900}.empty{text-align:center;color:var(--muted);padding:28px}
#login{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(420px,100%);padding:28px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}.err{height:20px;color:var(--r);font-size:12px;font-weight:700}
#app{display:none}.status{font-size:12px;color:var(--g);font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:12px}.title{font-size:16px}.logo{width:40px;height:40px}.status{display:none}.value{font-size:22px}}
</style>
</head>
<body>
<section id="login"><form class="login" id="form">
<div class="brand"><img class="logo" src="../logo.png"><div><div class="title">ZAROUALI CAISSE</div><div class="sub">Administration à distance</div></div></div>
<h2>Connexion Admin</h2>
<div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username"></div>
<div class="field"><label>Mot de passe</label><input id="pass" type="password" required autocomplete="current-password"></div>
<div class="err" id="err"></div><button class="btn primary" style="width:100%" type="submit">Se connecter</button>
</form></section>

<main id="app"><div class="wrap">
<header class="top"><div class="brand"><img class="logo" src="../logo.png"><div><div class="title">ZAROUALI CAISSE — ADMIN</div><div class="sub">POS synchronisé en temps réel</div></div></div>
<div><span class="status" id="status">● En direct</span> <button class="btn" id="out">Déconnexion</button></div></header>
<section class="grid">
<div class="card"><div class="label">Chiffre d'affaires</div><div class="value" id="ca">0 MAD</div></div>
<div class="card"><div class="label">Tickets</div><div class="value" id="tickets">0</div></div>
<div class="card"><div class="label">Produits</div><div class="value" id="products">0</div></div>
<div class="card"><div class="label">Stock faible</div><div class="value" id="low">0</div></div>
</section>
<section class="two">
<div class="panel"><div class="ph">Dernières ventes</div><div class="body"><table><thead><tr><th>Date</th><th>Caissier</th><th>Total</th></tr></thead><tbody id="sales"></tbody></table></div></div>
<div class="panel"><div class="ph">Stock faible</div><div class="body"><table><thead><tr><th>Produit</th><th>Stock</th><th>Min.</th></tr></thead><tbody id="lowt"></tbody></table></div></div>
</section>
</div></main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getFirestore,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyB9juWEafOYe0uKeh_rhSBzCy6OMfyVAhM",authDomain:"zarouali-caisse.firebaseapp.com",projectId:"zarouali-caisse",storageBucket:"zarouali-caisse.firebasestorage.app",messagingSenderId:"460165316759",appId:"1:460165316759:web:5b8e8eab8c1fdaa70669d2",measurementId:"G-6JDNJTKEXJ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app),ref=doc(fs,"caisse","main");
const money=n=>Number(n||0).toLocaleString("fr-MA",{minimumFractionDigits:2,maximumFractionDigits:2})+" MAD";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(d){
 const p=Array.isArray(d?.products)?d.products:[], s=Array.isArray(d?.sales)?d.sales:[], c=Array.isArray(d?.cashiers)?d.cashiers:[];
 const low=p.filter(x=>Number(x.stock||0)<=Number(x.minStock??5)), names=new Map(c.map(x=>[String(x.id),x.name]));
 document.querySelector("#ca").textContent=money(s.reduce((a,x)=>a+Number(x.total||0),0));
 document.querySelector("#tickets").textContent=s.length;document.querySelector("#products").textContent=p.length;document.querySelector("#low").textContent=low.length;
 const ss=[...s].sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0)).slice(0,15);
 document.querySelector("#sales").innerHTML=ss.length?ss.map(x=>`<tr><td>${esc(new Date(x.date||x.createdAt||Date.now()).toLocaleString("fr-MA"))}</td><td>${esc(names.get(String(x.cashierId))||x.cashierName||"—")}</td><td><b>${money(x.total)}</b></td></tr>`).join(""):'<tr><td colspan="3" class="empty">Aucune vente</td></tr>';
 document.querySelector("#lowt").innerHTML=low.slice(0,15).map(x=>`<tr><td>${esc(x.name||x.id)}</td><td class="low">${Number(x.stock||0)}</td><td>${Number(x.minStock??5)}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">Stock OK</td></tr>';
}
form.onsubmit=async e=>{e.preventDefault();err.textContent="";try{await signInWithEmailAndPassword(auth,email.value.trim(),pass.value)}catch(x){err.textContent="Connexion refusée : "+(x.code||"erreur")}};
out.onclick=()=>signOut(auth);
let stop=null;
onAuthStateChanged(auth,u=>{if(stop){stop();stop=null}if(u){login.style.display="none";app.style.display="block";stop=onSnapshot(ref,s=>{if(s.exists())render(s.data());status.textContent="● Synchronisé en direct"},e=>{console.error(e);status.textContent="● Erreur Firestore"})}else{login.style.display="grid";app.style.display="none"}});
</script>
</body></html>
